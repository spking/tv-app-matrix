name: Update & deploy

# Runs on every push to main, including saves from the editor (admin.html).
# The data is checked first; if it is invalid nothing is deployed and the site keeps
# its last good version. "Run workflow" on the Actions tab redeploys by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history: the version number is the commit count

      - uses: actions/setup-node@v7
        with: { node-version: 22 }

      - name: Check data
        run: node scripts/check.mjs

      - name: Assemble site
        run: |
          mkdir _site
          cp -r *.html *.js *.css data logos _site/
          node scripts/stamp-version.mjs _site/data/matrix.json

      - uses: actions/upload-pages-artifact@v5
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
