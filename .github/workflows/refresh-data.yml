name: Refresh data from Google Sheet

on:
  workflow_dispatch:        # "Run workflow" button on the Actions tab
  # schedule:               # uncomment to also refresh automatically (UTC)
  #   - cron: "17 6 * * 1"  # Mondays 06:17

permissions:
  contents: write

env:
  SHEET_ID: 1zhWzwLFq3yAZnI-qDM5xI-zwDQpTqeLgD5K1OpCnd0k

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/refresh-data.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- data; then
            echo "No changes in the sheet."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Refresh matrix data from Google Sheet"
          git push
